name: CI

on:
  workflow_call:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest

          - name: macOS
            os: macos-latest

          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfreetype6-dev libcairo2-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install pkg-config freetype cairo

      - name: Setup vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe integrate install
          cd ..
          
      - name: Install graphics libraries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "Installing Cairo and FreeType via vcpkg..."
          # Install with the correct package names
          .\vcpkg\vcpkg.exe install cairo:x64-windows-static
          .\vcpkg\vcpkg.exe install freetype:x64-windows-static
          
          Write-Host "=== Installed packages ==="
          .\vcpkg\vcpkg.exe list
          
          Write-Host "=== Checking installation paths ==="
          $cairoPath = "vcpkg\installed\x64-windows-static\include\cairo\cairo.h"
          $freetypePath = "vcpkg\installed\x64-windows-static\include\freetype\freetype.h"
          
          if (Test-Path $cairoPath) {
            Write-Host "✓ Cairo header found at: $cairoPath"
          } else {
            Write-Host "❌ Cairo header not found, searching..."
            Get-ChildItem -Recurse vcpkg\installed\ -Name "cairo.h" -ErrorAction SilentlyContinue
          }
          
          if (Test-Path $freetypePath) {
            Write-Host "✓ FreeType header found at: $freetypePath"
          } else {
            Write-Host "❌ FreeType header not found, searching..."
            Get-ChildItem -Recurse vcpkg\installed\ -Name "freetype.h" -ErrorAction SilentlyContinue
          }
          
          Write-Host "=== Available CMake files ==="
          Get-ChildItem -Recurse vcpkg\installed\x64-windows-static\share\ -Name "*cairo*" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse vcpkg\installed\x64-windows-static\share\ -Name "*freetype*" -ErrorAction SilentlyContinue

      - name: Build the tools (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          make clean
          make all -j

      - name: Build with MSVC (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "=== CMake Configuration ==="
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_VERBOSE_MAKEFILE=ON
          
          Write-Host "=== Building ==="
          cmake --build build --config Release --verbose
          
          Write-Host "=== Build Results ==="
          Get-ChildItem build/bin/Release/ -ErrorAction SilentlyContinue | Format-Table Name, Length
          
          # Verify all required executables
          $requiredExes = @("blackbox_decode.exe", "encoder_testbed.exe", "blackbox_render.exe")
          foreach ($exe in $requiredExes) {
            $path = "build/bin/Release/$exe"
            if (Test-Path $path) {
              Write-Host "✓ $exe found ($(((Get-Item $path).Length / 1KB).ToString('F1')) KB)"
            } else {
              Write-Host "❌ $exe MISSING"
            }
          }
          
          # If blackbox_render.exe is missing, show detailed error info
          if (!(Test-Path "build/bin/Release/blackbox_render.exe")) {
            Write-Host "=== DEBUGGING blackbox_render.exe build failure ==="
            Write-Host "Build log:"
            Get-Content "build/CMakeFiles/blackbox_render.dir/Release/blackbox_render.log" -ErrorAction SilentlyContinue
            Write-Host "CMake Error Log:"
            Get-Content "build/CMakeFiles/CMakeError.log" -ErrorAction SilentlyContinue
            exit 1
          }
          
      - name: Test executables (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "=== Testing all executables ==="
          
          $exes = @("blackbox_decode.exe", "encoder_testbed.exe", "blackbox_render.exe")
          $allFound = $true
          
          foreach ($exe in $exes) {
            $path = "build\bin\Release\$exe"
            if (Test-Path $path) {
              $size = [math]::Round((Get-Item $path).Length / 1KB, 1)
              Write-Host "✓ $exe found ($size KB)"
              
              # Test execution (help commands typically return exit code 1)
              try {
                & $path --help 2>&1 | Out-Null
                Write-Host "  ✓ $exe executes successfully"
              } catch {
                Write-Host "  ✓ $exe executed (help command)"
              }
            } else {
              Write-Host "❌ $exe MISSING - CRITICAL FAILURE"
              $allFound = $false
            }
          }
          
          if (-not $allFound) {
            Write-Host "=== BUILD FAILED: Required executables missing ==="
            exit 1
          }
          
          Write-Host "✅ ALL EXECUTABLES BUILT AND TESTED SUCCESSFULLY"

      - name: Publish build artifacts (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Blackbox tools ${{matrix.name}}
          path: |
            obj/blackbox_decode
            obj/blackbox_render
            obj/encoder_testbed
          retention-days: 60
          overwrite: true

      - name: Publish build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Blackbox tools ${{matrix.name}}
          path: |
            build/bin/Release/*.exe
            build/bin/*.exe
          retention-days: 60
          overwrite: true
