name: CI

on:
  workflow_call:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest

          - name: macOS
            os: macos-latest

          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfreetype6-dev libcairo2-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install pkg-config freetype cairo

      - name: Setup vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          
      - name: Install static libraries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "Installing Cairo and FreeType via vcpkg..."
          # Try both static and dynamic versions
          .\vcpkg\vcpkg.exe install cairo:x64-windows freetype:x64-windows cairo:x64-windows-static freetype:x64-windows-static
          Write-Host "Installed packages:"
          .\vcpkg\vcpkg.exe list

      - name: Build the tools (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          make clean
          make all -j

      - name: Build with MSVC (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Write-Host "Configuring with CMake (trying dynamic libs first)..."
          try {
            cmake -B build -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -G "Visual Studio 17 2022" -A x64
          } catch {
            Write-Host "Dynamic linking failed, trying static..."
            cmake -B build -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -G "Visual Studio 17 2022" -A x64
          }
          Write-Host "Building with CMake..."
          cmake --build build --config Release
          Write-Host "Build completed. Checking output:"
          Get-ChildItem build/bin/Release/ -ErrorAction SilentlyContinue
          
      - name: Test executables (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Get-ChildItem -Recurse build/
          if (Test-Path "build/bin/Release/blackbox_decode.exe") { 
            Write-Host "Testing blackbox_decode.exe..."
            try {
              .\build\bin\Release\blackbox_decode.exe --help 2>&1 | Out-Null
            } catch {
              # Help command returns exit code 1, which is expected
            }
            Write-Host "blackbox_decode.exe executed successfully"
          } else {
            Write-Host "blackbox_decode.exe not found in expected location"
            Get-ChildItem -Recurse build/ -Name "*.exe"
            exit 1
          }
          
          if (Test-Path "build/bin/Release/encoder_testbed.exe") {
            Write-Host "encoder_testbed.exe found"
          } else {
            Write-Host "encoder_testbed.exe not found"
            exit 1
          }
          
          if (Test-Path "build/bin/Release/blackbox_render.exe") {
            Write-Host "blackbox_render.exe found (with graphics dependencies)"
          } else {
            Write-Host "blackbox_render.exe not found (graphics dependencies not available)"
          }

      - name: Publish build artifacts (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Blackbox tools ${{matrix.name}}
          path: |
            obj/blackbox_decode
            obj/blackbox_render
            obj/encoder_testbed
          retention-days: 60
          overwrite: true

      - name: Publish build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Blackbox tools ${{matrix.name}}
          path: |
            build/bin/Release/*.exe
            build/bin/*.exe
          retention-days: 60
          overwrite: true
